# 共享发布入口；仅由采集 workflow 调用。验证后增量写入现有 MySQL API。
# 只有此 job 可以合并、门禁、finalize、推 data；整个过程持同一把锁。
name: publish-release
on:
  workflow_call:
    inputs:
      scope:
        type: string
        required: true
      reviewed_accessory_sha256:
        type: string
        default: ''
        required: false
      earbuds_intake_only:
        type: boolean
        default: false
        required: false
      product_sources_only:
        type: boolean
        default: false
        required: false
      mihome_intake_only:
        type: boolean
        default: false
        required: false
      mihome_catalog_only:
        type: boolean
        default: false
        required: false
    secrets:
      CATALOG_API_URL:
        required: true
      CATALOG_IMPORT_TOKEN:
        required: true
permissions:
  contents: write
  actions: read
  checks: read
jobs:
  publish:
    runs-on: ubuntu-latest
    # Tests, finalization, data push and full OSS digest readback share one lock.
    # 2026-11-05: the 42MB export exceeded the former 15m budget during
    # verified mirroring (run 42033026453). Keep every gate and allow slow egress.
    timeout-minutes: 45
    concurrency:
      group: goodsdex-data-publication
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require database import credentials before publishing
        env:
          CATALOG_API_URL: ${{ secrets.CATALOG_API_URL }}
          CATALOG_IMPORT_TOKEN: ${{ secrets.CATALOG_IMPORT_TOKEN }}
        run: |
          test -n "$CATALOG_API_URL" && test -n "$CATALOG_IMPORT_TOKEN" || {
            echo '::error::缺少商品库专用导入配置，拒绝发布'; exit 1;
          }
      - name: Read latest data while holding publication lock
        uses: actions/checkout@v4
        with:
          ref: data
          path: _data
          fetch-depth: 1
      - name: Restore lossless catalogue from Git storage
        run: python3 scripts/catalog_git_storage.py unpack --public _data/public
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - name: Save exact pre-migration release
        if: ${{ inputs.product_sources_only }}
        run: python3 scripts/migrate_product_sources.py snapshot --public _data/public --backup "$RUNNER_TEMP/product-sources-before.tar.gz"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.product_sources_only }}
        with:
          name: product-sources-rollback-${{ github.run_id }}
          path: ${{ runner.temp }}/product-sources-before.tar.gz
          retention-days: 30
      - name: Merge candidate onto latest release
        env:
          EXPECTED_SCOPE: ${{ inputs.scope }}
        run: |
          cp _data/public/goods.json "$RUNNER_TEMP/goods-before.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          bundle = json.loads((Path(os.environ['RUNNER_TEMP']) / 'candidate/candidate.json').read_text())
          assert bundle['scope'] == os.environ['EXPECTED_SCOPE'], 'Candidate scope mismatch'
          PY
          python3 scripts/release_candidate.py merge --root _data --candidate "$RUNNER_TEMP/candidate/candidate.json"
      - name: Restore captured L6 evidence for finalizer replay
        run: |
          if [ -f _data/docs/release-coverage/L6/result.json ]; then
            mkdir -p docs/release-coverage/L6 data/third-party
            cp -r _data/docs/release-coverage/L6/. docs/release-coverage/L6/
            cp _data/docs/release-coverage/L6/result.json data/third-party/l6-release-evidence.json
          fi
      - name: Rebuild legacy full-crawl candidates missing their logical public delta
        if: ${{ inputs.scope == 'all' }}
        run: |
          PYTHONPATH=src python3 - <<'PY'
          import json, os
          from pathlib import Path
          bundle = json.loads((Path(os.environ['RUNNER_TEMP']) / 'candidate/candidate.json').read_text())
          if 'public/goods.json' not in bundle['files']:
              from goodsdex.publish import build
              print('Rebuild public view from merged snapshots: legacy candidate omitted untracked goods.json')
              build(Path('_data/data/categories'), Path('_data/public'))
          PY
      - name: Test publication invariants
        run: |
          python3 -m pip install --quiet pytest Pillow requests beautifulsoup4
          PYTHONPATH=src:scripts python3 -m pytest -q tests/test_atour.py tests/test_legacy_catalog.py tests/test_retirement.py tests/test_hp_history.py tests/test_hp.py tests/test_accessories.py tests/test_mi_names.py tests/test_mi_legacy_names.py tests/test_identity.py tests/test_exclusions.py tests/test_apparel.py tests/test_brands.py tests/test_release_policy.py tests/test_release_tolerance.py tests/test_release_dates.py tests/test_official_retrospective_release.py tests/test_series_release.py tests/test_series_release_rollout.py tests/test_date_enrichment.py tests/test_release_crosschecks.py tests/test_release_scope_media.py tests/test_supplement_publish.py tests/test_dedupe.py tests/test_shards.py tests/test_release_candidate.py tests/test_mirror_public.py tests/test_sources_status.py tests/test_source_urls.py tests/test_car_structure.py tests/test_price_history.py tests/test_price_semantics.py tests/test_variant_attributes.py tests/test_mihome_catalog.py tests/test_mihome_intake.py tests/test_earbuds_intake.py tests/test_product_sources.py tests/test_lineage.py
      - name: Verify final release (no lost IDs and responsibility invariants)
        env:
          RELEASE_SCOPE: ${{ inputs.scope }}
        run: |
          PYTHONPATH=src python3 - <<'PY'
          import json, os
          from pathlib import Path
          from goodsdex.release_policy import assert_no_lost_ids
          from goodsdex.supplements import publish
          public = Path('_data/public')
          previous = json.loads((Path(os.environ['RUNNER_TEMP']) / 'goods-before.json').read_text())
          current = json.loads((public / 'goods.json').read_text())
          assert_no_lost_ids(previous, current)
          publish(current, public, previous, apply_backfills=False,
                  car_refresh=os.environ['RELEASE_SCOPE'] == 'cars')
          PY
          EXTRA=()
          if [ "$RELEASE_SCOPE" = cars ]; then EXTRA+=(--car-refresh); fi
          python3 scripts/verify_goods_release.py --public _data/public --previous "$RUNNER_TEMP/goods-before.json" "${EXTRA[@]}"
      - name: Snapshot collection and publication liveness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_sources_status.py --public _data/public
      - name: Finalize once (dedupe, tombstones, normalization, shards)
        env:
          REVIEWED_ACCESSORY_SHA256: ${{ inputs.reviewed_accessory_sha256 }}
          EARBUDS_INTAKE_ONLY: ${{ inputs.earbuds_intake_only }}
          PRODUCT_SOURCES_ONLY: ${{ inputs.product_sources_only }}
          MIHOME_CATALOG_ONLY: ${{ inputs.mihome_catalog_only }}
          MIHOME_INTAKE_ONLY: ${{ inputs.mihome_intake_only }}
        run: |
          EXTRA=()
          if [ "$EARBUDS_INTAKE_ONLY" = true ]; then EXTRA+=(--earbuds-intake-only); fi
          if [ "$PRODUCT_SOURCES_ONLY" = true ]; then EXTRA+=(--product-sources-only); fi
          if [ "$MIHOME_CATALOG_ONLY" = true ]; then EXTRA+=(--mihome-catalog-only); fi
          if [ "$MIHOME_INTAKE_ONLY" = true ]; then EXTRA+=(--mihome-intake-only); fi
          python3 scripts/finalize_public.py --public _data/public --previous "$RUNNER_TEMP/goods-before.json" --reviewed-accessory-sha256 "$REVIEWED_ACCESSORY_SHA256" "${EXTRA[@]}"
          if [ "$MIHOME_CATALOG_ONLY" = true ]; then
            PYTHONPATH=src python3 - <<'PY'
          import json, os
          from pathlib import Path
          from goodsdex.mihome_catalog import apply_catalog
          before = json.loads((Path(os.environ['RUNNER_TEMP']) / 'goods-before.json').read_text())
          after = json.loads(Path('_data/public/goods.json').read_text())
          expected = apply_catalog(before)
          if any(r.get('source_policy') for r in before):
              from goodsdex.product_sources import apply_sources
              expected = apply_sources(expected, before)
          assert after == expected, 'Unexpected fields changed in Mi Home metadata publication'
          PY
          fi
          if [ "$MIHOME_INTAKE_ONLY" = true ]; then
            PYTHONPATH=src python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          from goodsdex.mihome_intake import apply_intake
          before = json.loads((Path(os.environ['RUNNER_TEMP']) / 'goods-before.json').read_text())
          after = json.loads(Path('_data/public/goods.json').read_text())
          expected = apply_intake(before)
          if any(r.get('source_policy') for r in before):
              from goodsdex.product_sources import apply_sources
              expected = apply_sources(expected, before)
          assert after == expected, 'Unexpected change outside reviewed Mi Home intake'
          assert after[:len(before)] == before, 'Existing product fields changed'
          PYCODE
          fi
      - name: Verify append-only Earbuds publication
        if: ${{ inputs.earbuds_intake_only }}
        run: |
          PYTHONPATH=src python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          from goodsdex.earbuds_intake import apply_intake
          before = json.loads((Path(os.environ['RUNNER_TEMP']) / 'goods-before.json').read_text())
          after = json.loads(Path('_data/public/goods.json').read_text())
          expected = apply_intake(before)
          assert after == expected, 'Existing rows changed or reviewed Earbuds intake missing'
          assert len(after) - len(before) in (0, 23), 'Partial Earbuds intake'
          PYCODE
          python3 scripts/verify_earbuds_intake.py --before "$RUNNER_TEMP/goods-before.json" --public _data/public --output "$RUNNER_TEMP/earbuds-acceptance.json"
      - uses: actions/download-artifact@v4
        with:
          name: source-metrics
          path: ${{ runner.temp }}/collected-source-metrics
      - name: Measure actual published additions after finalization
        run: |
          PYTHONPATH=src:scripts python3 - <<'PYCODE'
          import json,os
          from pathlib import Path
          from source_registry import metrics
          p=Path(os.environ['RUNNER_TEMP'])
          result=metrics(json.loads((p/'goods-before.json').read_text()),json.loads(Path('_data/public/goods.json').read_text()))
          collected=json.loads((p/'collected-source-metrics/source-metrics.json').read_text())
          result['items_found']=collected['items_found']
          if 'discovery_pending' in collected: result['discovery_pending']=collected['discovery_pending']
          (p/'source-metrics.json').write_text(json.dumps(result,ensure_ascii=False))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: source-metrics
          path: ${{ runner.temp }}/source-metrics.json
          overwrite: true
      - name: Push one complete release to data
        env:
          RELEASE_SCOPE: ${{ inputs.scope }}
        run: |
          python3 scripts/catalog_git_storage.py pack --public _data/public
          cd _data
          git config user.name goodsdex-bot
          git config user.email goodsdex-bot@users.noreply.github.com
          git add -A
          git add -f public data
          git rm --cached --ignore-unmatch public/goods.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "$RELEASE_SCOPE publication $(date -u +%Y-%m-%dT%H:%MZ)"
          # No force push or automatic conflict resolution. A failed mirror is rerunnable.
          git push origin HEAD:data
      - name: Import only changed records into the authoritative MySQL catalogue
        env:
          CATALOG_API_URL: ${{ secrets.CATALOG_API_URL }}
          CATALOG_IMPORT_TOKEN: ${{ secrets.CATALOG_IMPORT_TOKEN }}
        run: node scripts/publish_mysql.mjs _data/public
      - name: Record release summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          meta = json.loads(Path('_data/public/meta.json').read_text())
          print(f"Inventory: {meta['total_all']} = {meta['total_published']} published + {meta['total_excluded']} excluded; revision={meta['revision']}; excluded sha256={meta['files']['goods-excluded.json']['sha256']}")
          accessory = meta.get('accessories', {})
          print(f"Accessory exclusions: new={accessory.get('newly_excluded_count')}, ratio={accessory.get('newly_excluded_ratio')}, gate={accessory.get('gate')}, exact batch reviewed={accessory.get('reviewed')}")
          print(f"Published {meta['count']} rows; {len(meta['files'])} verified files; one finalize under goodsdex-data-publication lock.")
          PY
