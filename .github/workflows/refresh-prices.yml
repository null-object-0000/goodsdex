# 小米／大疆／富士价格回灌；每小时 :23，目标总耗时 <5 分钟。
# 产出候选差量 artifact；共享 publish-release 负责合并、门禁、分片和 OSS。
name: refresh-prices
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  checks: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/collect-base
      - name: Refresh prices (only this responsibility)
        run: python3 scripts/ci_refresh_prices.py --public _data/public --candidate-only --supplements data/supplements/goods-supplements.json
      - uses: ./.github/actions/upload-candidate
        with:
          scope: prices
  publish:
    needs: collect
    uses: ./.github/workflows/publish-release.yml
    with:
      scope: prices
    secrets: inherit
