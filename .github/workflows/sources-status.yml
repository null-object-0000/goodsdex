name: sources-status
on:
  schedule:
    - cron: '50 22 * * *'
  workflow_run:
    workflows: [refresh-mihome-catalog, refresh-earbuds, refresh-mihome-gap, refresh-images, refresh-legacy, refresh-release-dates, release-dates-daily, refresh-prices, refresh-apple, refresh-hp, refresh-cars, refresh-atour, crawl-all]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  checks: read
concurrency:
  group: mysql-source-status
  cancel-in-progress: false
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh source status directly in MySQL
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CATALOG_API_URL: ${{ secrets.CATALOG_API_URL }}
          CATALOG_IMPORT_TOKEN: ${{ secrets.CATALOG_IMPORT_TOKEN }}
        run: python scripts/sync_mysql_source_status.py
