# 汽车独立采集；北京时间每天 12:17，产出已审查汽车候选。
# 产出候选差量 artifact；共享 publish-release 负责合并、门禁、分片和 OSS。
name: refresh-cars
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      verified_only:
        description: '仅发布本地已核实输入，不重新采集'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/collect-base
      - name: Test car publication guards
        run: |
          python3 -m pip install --quiet pytest
          PYTHONPATH=src:scripts python3 -m pytest -q tests/test_car_catalog.py tests/test_publish_cars.py tests/test_publish_car_history.py
      - name: Capture approved cars or stage verified inputs
        env:
          VERIFIED_ONLY: ${{ inputs.verified_only }}
        run: |
          if [ "$VERIFIED_ONLY" = true ]; then
            python3 scripts/car_catalog.py --verified-only --out "$RUNNER_TEMP/car-input"
            python3 scripts/publish_cars.py --public _data/public --input "$RUNNER_TEMP/car-input" --append-only
          else
            python3 scripts/car_catalog.py --approved --out "$RUNNER_TEMP/car-input"
            python3 scripts/publish_cars.py --public _data/public --input "$RUNNER_TEMP/car-input"
          fi
          python3 scripts/publish_cars.py --public _data/public --historical-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: car-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/car-input/
          retention-days: 14
      - uses: ./.github/actions/upload-candidate
        with:
          scope: cars
  publish:
    needs: collect
    uses: ./.github/workflows/publish-release.yml
    with:
      scope: cars
    secrets: inherit
