name: refresh-cars

on:
  schedule:
    - cron: '17 4 * * *' # 北京时间每天 12:17
  workflow_dispatch:
    inputs:
      verified_only:
        description: '仅发布本地已核实输入，不重新采集（发布验证时使用）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: goodsdex-data-publication
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require OSS credentials
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          test -n "$OSS_ACCESS_KEY_ID" && test -n "$OSS_ACCESS_KEY_SECRET" || {
            echo '::error::缺少 OSS 密钥，拒绝发布'; exit 1;
          }
      - name: Fetch latest data
        run: |
          git fetch origin data
          git worktree add --detach _data origin/data
      - name: Test car publication guards
        run: |
          python3 -m pip install --quiet pytest
          PYTHONPATH=src:scripts python3 -m pytest -q tests/test_car_catalog.py tests/test_publish_cars.py tests/test_publish_car_history.py
      - name: Capture approved cars or stage verified inputs
        env:
          VERIFIED_ONLY: ${{ inputs.verified_only }}
        run: |
          if [ "$VERIFIED_ONLY" = true ]; then
            python3 scripts/car_catalog.py --verified-only --out "$RUNNER_TEMP/car-input"
          else
            python3 scripts/car_catalog.py --approved --out "$RUNNER_TEMP/car-input"
          fi
      - name: Merge reviewed cars (fail before writing on any invariant violation)
        run: |
          if [ "${{ inputs.verified_only }}" = true ]; then
            python3 scripts/publish_cars.py --public _data/public --input "$RUNNER_TEMP/car-input" --append-only
          else
            python3 scripts/publish_cars.py --public _data/public --input "$RUNNER_TEMP/car-input"
          fi
      - name: Append reviewed historical cars without changing existing objects
        run: python3 scripts/publish_cars.py --public _data/public --historical-only
      - name: Merge category duplicates and validate final release
        run: python3 scripts/finalize_public.py --public _data/public --previous "$RUNNER_TEMP/goods-before.json"

      - name: Push car release to data branch
        run: |
          cd _data
          git config user.name goodsdex-bot
          git config user.email goodsdex-bot@users.noreply.github.com
          git add public/goods.json public/meta.json public/merge-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "daily car publication $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:data
          fi
      - name: Mirror release to OSS and verify remote contents
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          python3 -m pip install --quiet oss2
          python3 scripts/mirror_public_to_oss.py --public _data/public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: car-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/car-input/
          retention-days: 14
