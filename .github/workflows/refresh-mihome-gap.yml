name: refresh-mihome-gap
on:
  schedule:
    - cron: '10 20 * * 6'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  checks: read
concurrency:
  group: refresh-mihome-gap
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/collect-base
      - run: python3 -m pip install requests Pillow
      - name: Collect fresh directory and discover unknown identities
        env:
          EARBUDS_AUTH_KEY: ${{ secrets.EARBUDS_AUTH_KEY }}
        run: PYTHONPATH=src:scripts python3 scripts/collect_device_directories.py --source gap
      - uses: ./.github/actions/upload-candidate
        with:
          scope: all
  publish:
    needs: collect
    uses: ./.github/workflows/publish-release.yml
    with:
      scope: all
    secrets: inherit
