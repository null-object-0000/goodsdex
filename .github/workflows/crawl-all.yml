# Full category discovery; existing rows and prices belong to independent collectors.
name: crawl-all
on:
  schedule:
    - cron: '37 19 * * 6'  # Sunday 03:37 CST; full discovery is weekly before launch.
  workflow_dispatch:
    inputs:
      categories:
        description: 'Official category names, space-separated; empty scans every category'
        required: false
        default: ''
      candidate_run_id:
        description: 'Recover a trusted saved candidate; empty creates a fresh discovery'
        required: false
        default: ''
permissions:
  contents: write
  actions: read
  checks: read
jobs:
  crawl:
    if: ${{ !github.event.inputs.candidate_run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/collect-base
      - name: Discover every category and collect verified new products only
        env:
          GOODSDEX_PROXY: ''
          CATEGORIES: ${{ inputs.categories }}
        run: |
          # Treat input as arguments, never executable shell source.
          read -r -a ARGS <<< "$CATEGORIES"
          python3 scripts/discover_catalog.py --root _data "${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-discovery-evidence-${{ github.run_id }}
          path: _data/data/catalog-discovery-report.json
          retention-days: 14
          if-no-files-found: warn
      - uses: ./.github/actions/upload-candidate
        with:
          scope: all
          collector_mode: discovery
  recover:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.candidate_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ github.event.inputs.candidate_run_id }}
          run-id: ${{ github.event.inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v4
        with:
          name: source-metrics
          run-id: ${{ github.event.inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/saved-metrics
      - name: Validate saved collector provenance and responsibility
        env:
          RECOVERY_RUN_ID: ${{ github.event.inputs.candidate_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/validate_crawl_recovery.py
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate/candidate.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: source-metrics
          path: ${{ runner.temp }}/saved-metrics/source-metrics.json
          if-no-files-found: error
  publish:
    needs: [crawl, recover]
    if: ${{ always() && (needs.crawl.result == 'success' || needs.recover.result == 'success') }}
    uses: ./.github/workflows/publish-release.yml
    with:
      scope: all
    secrets: inherit
