# 仅手动恢复镜像；读取现有 data 发布集，校验后同步 OSS，不 finalize、不推 data。
name: mirror-sharded-release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: goodsdex-data-publication
  cancel-in-progress: false
  queue: max
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Retired catalogue mirror
        run: |
          echo '::error::商品库已迁入 MySQL。OSS 仅用于图片、证据和冷备份；禁止重新发布在线商品 JSON。'
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: _data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore lossless catalogue from Git storage
        run: python3 scripts/catalog_git_storage.py unpack --public _data/public
      - run: python3 -m pip install --quiet oss2
      - name: Mirror validated release (immutable blobs first, manifest last)
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: python3 scripts/mirror_public_to_oss.py --public _data/public
