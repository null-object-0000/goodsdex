name: release-dates-daily
on:
  schedule:
    - cron: '17 19 * * 0'
  workflow_dispatch:
    inputs:
      lane:
        type: choice
        options: [all, L1, L2, L3, L4, L5, L6, L7]
        default: all
      l6_full:
        description: Expand L6 after reviewing the 300-gid pilot
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
  checks: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/collect-base
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bounded collectors
        run: |
          # release_lane_xiaomi 解析官方 PDF 时直接调 pdftotext（poppler-utils），
          # runner 镜像没带，缺了会让整条 xiaomi lane 抛 FileNotFoundError、collect 判红。
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          command -v pdftotext
          python3 -m pip install requests beautifulsoup4
          npm install --prefix /tmp/release-browser playwright@1.56.1
          /tmp/release-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Collect independent lanes and append verified dates only
        env:
          ATOUR_PLAYWRIGHT_MODULE: /tmp/release-browser/node_modules/playwright
        run: |
          export ATOUR_CHROMIUM_PATH="$(node -e "process.stdout.write(require('/tmp/release-browser/node_modules/playwright').chromium.executablePath())")"
          EXTRA=()
          if [ '${{ inputs.l6_full }}' = true ]; then EXTRA+=(--l6-full); fi
          python3 scripts/release_dates_run.py --lane '${{ inputs.lane || 'L1' }}' --goods _data/public/goods.json --output docs/release-coverage --apply "${EXTRA[@]}"
          mkdir -p _data/docs/release-coverage
          cp docs/release-coverage/????-??-??.md _data/docs/release-coverage/
          cp docs/release-coverage/coverage.json _data/docs/release-coverage/
          cp docs/release-coverage/conflicts.json docs/release-coverage/tolerance-*.json _data/docs/release-coverage/
          if [ -d docs/release-coverage/L5 ]; then cp -r docs/release-coverage/L5 _data/docs/release-coverage/; fi
          if [ -d docs/release-coverage/L6 ]; then cp -r docs/release-coverage/L6 _data/docs/release-coverage/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-date-evidence-${{ github.run_id }}
          path: |
            docs/release-coverage/
            data/official/*release-evidence.json
            data/third-party/l5*
            data/third-party/l6*
            data/official/third_party_index.json
          retention-days: 30
      - uses: ./.github/actions/upload-candidate
        with:
          scope: all
  publish:
    needs: collect
    uses: ./.github/workflows/publish-release.yml
    with:
      scope: all
    secrets: inherit
