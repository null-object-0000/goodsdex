name: filter-accessories
on:
  workflow_dispatch:
    inputs:
      reviewed_accessory_sha256:
        description: 'Exact reviewed batch fingerprint; empty keeps the 5% gate fail-closed'
        type: string
        default: ''
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/collect-base
      - uses: ./.github/actions/upload-candidate
        with:
          scope: all
  publish:
    needs: collect
    uses: ./.github/workflows/publish-release.yml
    with:
      scope: all
      reviewed_accessory_sha256: ${{ inputs.reviewed_accessory_sha256 }}
    secrets: inherit
