# 小米旧款回填；仅手动触发，产出旧款商品与分类缓存候选。
# 产出候选差量 artifact；共享 publish-release 负责合并、门禁、分片和 OSS。
name: refresh-legacy
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/collect-base
      - name: Collect verified legacy product pages
        run: |
          mkdir -p data/categories
          if [ -f _data/data/categories/Mi_legacy.json ]; then
            cp _data/data/categories/Mi_legacy.json data/categories/
          fi
          python3 scripts/crawl_mi_legacy.py --public _data/public
          mkdir -p _data/data/categories
          cp data/categories/Mi_legacy.json _data/data/categories/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mi-legacy-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/mi-legacy/
          retention-days: 7
      - uses: ./.github/actions/upload-candidate
        with:
          scope: legacy
  publish:
    needs: collect
    uses: ./.github/workflows/publish-release.yml
    with:
      scope: legacy
    secrets: inherit
