# 每周日北京时间 12:43，经现有上海 API 读取已归档的惠普官方 SKU。
# 产出候选差量 artifact；共享 publish-release 负责门禁及 MySQL 增量导入。
name: refresh-hp
on:
  schedule:
    - cron: '43 4 * * 0'
  workflow_dispatch:
    inputs:
      replay_run:
        description: 'Resume a failed live capture: verify saved raw SHA256 and fetch only missing pages (scheduled runs always fetch fresh)'
        type: string
        default: ''
      history_only:
        description: 'Import verified official historical SKUs without refreshing live store pages'
        type: boolean
        default: false
      inject_failure:
        description: '验收专用：采集开始前明确失败，不生成候选、不触碰发布集'
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
  checks: read
jobs:
  collect:
    runs-on: ubuntu-latest
    # The old 12m job deadline could fire after the crawler exited successfully,
    # leaving every step green but collect cancelled. Budget setup + uploads too.
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      conclusion: ${{ steps.hp.outputs.conclusion }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/collect-base
      - name: Inject explicit collection failure for isolation acceptance
        if: ${{ inputs.inject_failure }}
        run: |
          echo '::error::Intentional HP collection failure; no candidate and no publication'
          exit 1
      - run: python3 -m pip install --quiet Pillow
      - name: Import verified official historical configurations
        run: python3 scripts/import_hp_history.py --out _data/data/hp --public _data/public
      - name: Validate live capture resume reference
        if: ${{ inputs.replay_run != '' }}
        env:
          REPLAY_RUN: ${{ inputs.replay_run }}
        run: '[[ "$REPLAY_RUN" =~ ^[0-9]+$ ]]'
      - name: Read previous failed live capture evidence
        if: ${{ inputs.replay_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: hp-evidence-${{ inputs.replay_run }}-1
          run-id: ${{ inputs.replay_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/hp-replay
      - id: hp
        name: Refresh HP configurations (known SKUs; reuse verified images; serial rate limit)
        # Bound collection separately so evidence/candidate upload and cleanup
        # have time before the enclosing job deadline. Failure still skips publish.
        timeout-minutes: 25
        env:
          HP_SOURCE_API_URL: ${{ secrets.CATALOG_API_URL }}
          HP_SOURCE_API_TOKEN: ${{ secrets.CATALOG_IMPORT_TOKEN }}
          REPLAY_RUN: ${{ inputs.replay_run }}
        run: |
          if [ '${{ inputs.history_only }}' != 'true' ]; then
            EXTRA=()
            if [ -n "$REPLAY_RUN" ]; then
              CAPTURE="$RUNNER_TEMP/hp-replay/_data/data/hp"
              ln -s "$RUNNER_TEMP/hp-replay/data/hp/raw" "$CAPTURE/raw"
              mkdir -p data/hp/raw
              cp -a "$CAPTURE/raw/." data/hp/raw/
              EXTRA+=(--replay "$CAPTURE")
            fi
            python3 scripts/crawl_hp.py --out _data/data/hp --public _data/public --reuse-images --known-only --interval-from-start "${EXTRA[@]}"
          fi
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          status = json.loads(Path('_data/data/hp/collection-status.json').read_text())
          if status['conclusion'] != 'success':
              raise RuntimeError('HP live source unavailable; existing catalogue retained: ' + str(status.get('error')))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('conclusion=' + status['conclusion'] + '\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hp-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _data/data/hp/
            data/hp/raw/
          retention-days: 7
      - uses: ./.github/actions/upload-candidate
        if: steps.hp.outputs.conclusion == 'success'
        with:
          scope: hp
  publish:
    if: needs.collect.outputs.conclusion == 'success'
    needs: collect
    uses: ./.github/workflows/publish-release.yml
    with:
      scope: hp
    secrets: inherit
