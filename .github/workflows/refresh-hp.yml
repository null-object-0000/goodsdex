# 惠普笔记本／台式机配置与价格；每小时 :43，目标总耗时 <15 分钟。
# 产出候选差量 artifact；共享 publish-release 负责合并、门禁、分片和 OSS。
name: refresh-hp
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      inject_failure:
        description: '验收专用：采集开始前明确失败，不生成候选、不触碰发布集'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/collect-base
      - name: Inject explicit collection failure for isolation acceptance
        if: ${{ inputs.inject_failure }}
        run: |
          echo '::error::Intentional HP collection failure; no candidate and no publication'
          exit 1
      - run: python3 -m pip install --quiet Pillow
      - name: Refresh HP configurations (reuse previously verified images)
        run: python3 scripts/crawl_hp.py --out _data/data/hp --public _data/public --reuse-images --seed 'https://www.hpstore.cn/catalogsearch/result/?q=%E6%98%9F14'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hp-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _data/data/hp/
            data/hp/raw/
          retention-days: 7
      - uses: ./.github/actions/upload-candidate
        with:
          scope: hp
  publish:
    needs: collect
    uses: ./.github/workflows/publish-release.yml
    with:
      scope: hp
    secrets: inherit
