# 惠普源封锁期间每天北京时间 12:43 探测一次；恢复后仍每日采集。
# 产出候选差量 artifact；共享 publish-release 负责门禁及 MySQL 增量导入。
name: refresh-hp
on:
  schedule:
    - cron: '43 4 * * 0'
  workflow_dispatch:
    inputs:
      history_only:
        description: 'Import verified official historical SKUs without refreshing live store pages'
        type: boolean
        default: false
      inject_failure:
        description: '验收专用：采集开始前明确失败，不生成候选、不触碰发布集'
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
  checks: read
jobs:
  collect:
    runs-on: ubuntu-latest
    # The old 12m job deadline could fire after the crawler exited successfully,
    # leaving every step green but collect cancelled. Budget setup + uploads too.
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      conclusion: ${{ steps.hp.outputs.conclusion }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/collect-base
      - name: Inject explicit collection failure for isolation acceptance
        if: ${{ inputs.inject_failure }}
        run: |
          echo '::error::Intentional HP collection failure; no candidate and no publication'
          exit 1
      - run: python3 -m pip install --quiet Pillow
      - name: Import verified official historical configurations
        run: python3 scripts/import_hp_history.py --out _data/data/hp --public _data/public
      - name: Probe HP availability from the Actions egress
        if: ${{ !inputs.history_only }}
        env:
          HP_PROBE_OUT: _data/data/hp/probe
        run: python3 docs/hp-403-20261103/probe.py
      - id: hp
        name: Refresh HP configurations (known SKUs; reuse verified images; serial rate limit)
        # Bound collection separately so evidence/candidate upload and cleanup
        # have time before the enclosing job deadline. Failure still skips publish.
        timeout-minutes: 13
        run: |
          if [ '${{ inputs.history_only }}' != 'true' ]; then
            python3 scripts/crawl_hp.py --out _data/data/hp --public _data/public --reuse-images --known-only --interval-from-start
          fi
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          status = json.loads(Path('_data/data/hp/collection-status.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('conclusion=' + status['conclusion'] + '\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hp-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _data/data/hp/
            data/hp/raw/
          retention-days: 7
      - uses: ./.github/actions/upload-candidate
        if: steps.hp.outputs.conclusion == 'success' || steps.hp.outputs.conclusion == 'degraded'
        with:
          scope: hp
  publish:
    if: needs.collect.outputs.conclusion == 'success' || needs.collect.outputs.conclusion == 'degraded'
    needs: collect
    uses: ./.github/workflows/publish-release.yml
    with:
      scope: hp
    secrets: inherit
