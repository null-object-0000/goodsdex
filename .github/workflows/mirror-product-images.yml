name: mirror-product-images
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: goodsdex-data-publication
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose a single public origin image without cloud writes
        run: |
          python3 -m pip install --quiet requests Pillow
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from mirror_product_images import download,convert
          src='https://cdn.cnbj1.fds.api.mi-img.com/nr-pub/202502071658_0eb3002d3d509ee15831f567e338f30f.jpg'
          try:
              raw=download(src)
              print({'sourceBytes':len(raw),'compressedBytes':len(convert(raw))})
          except Exception as e:
              print({'error':type(e).__name__,'detail':str(e)[:600]})
          PY
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: data
          path: _data
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python3 scripts/catalog_git_storage.py unpack --public _data/public
      - run: python3 -m pip install --quiet Pillow requests oss2
      - name: Fill missing image assets and publish only verified MySQL deltas
        env:
          CATALOG_API_URL: ${{ secrets.CATALOG_API_URL }}
          CATALOG_IMPORT_TOKEN: ${{ secrets.CATALOG_IMPORT_TOKEN }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: node scripts/publish_mysql.mjs _data/public
