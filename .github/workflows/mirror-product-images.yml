name: mirror-product-images
on:
  workflow_dispatch:
    inputs:
      repair_legacy:
        description: 'Re-fetch legacy JPEG covers once to restore lost transparency'
        type: boolean
        default: false
      retry_failed:
        description: 'Retry failed source URLs immediately; existing successful mirrors remain untouched'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: goodsdex-data-publication
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: _data
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python3 scripts/catalog_git_storage.py unpack --public _data/public
      - run: python3 -m pip install --quiet Pillow requests oss2
      - name: Fill missing image assets and publish only verified MySQL deltas
        env:
          CATALOG_API_URL: ${{ secrets.CATALOG_API_URL }}
          CATALOG_IMPORT_TOKEN: ${{ secrets.CATALOG_IMPORT_TOKEN }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          IMAGE_RETRY_FAILED: ${{ inputs.retry_failed }}
          IMAGE_REPAIR_LEGACY: ${{ inputs.repair_legacy }}
        run: node scripts/publish_mysql.mjs _data/public
