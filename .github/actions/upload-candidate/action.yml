name: Upload collector delta
description: Package changed inputs only, excluding generated release files.
inputs:
  scope:
    required: true
    description: Collector responsibility
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CANDIDATE_SCOPE: ${{ inputs.scope }}
      run: python3 scripts/release_candidate.py pack --root _data --scope "$CANDIDATE_SCOPE" --candidate "$RUNNER_TEMP/candidate/candidate.json"
    - shell: bash
      run: |
        PYTHONPATH=src:scripts python3 - <<'PYCODE'
        import json, os
        from pathlib import Path
        from source_registry import metrics
        p=Path(os.environ['RUNNER_TEMP'])
        result=metrics(json.loads((p/'source-before.json').read_text()), json.loads(Path('_data/public/goods.json').read_text()))
        if (p/'directory-metrics.json').exists(): result.update(json.loads((p/'directory-metrics.json').read_text()))
        (p/'source-metrics.json').write_text(json.dumps(result,ensure_ascii=False))
        PYCODE
    - uses: actions/upload-artifact@v4
      with:
        name: source-metrics
        path: ${{ runner.temp }}/source-metrics.json
    - uses: actions/upload-artifact@v4
      with:
        name: candidate-${{ github.run_id }}
        path: ${{ runner.temp }}/candidate/candidate.json
        overwrite: true
        retention-days: 7
        if-no-files-found: error
