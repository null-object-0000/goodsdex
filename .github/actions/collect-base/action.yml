name: Read collector baseline
description: Read data without a publication lock; collectors never push or finalize.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/checkout@v4
      with:
        ref: data
        path: _data
        fetch-depth: 1
        persist-credentials: false
    - shell: bash
      run: python3 scripts/catalog_git_storage.py unpack --public _data/public
    - shell: bash
      run: cp _data/public/goods.json "$RUNNER_TEMP/source-before.json"
